<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>MixLab</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25253d"/><stop offset="1" stop-color="#08080e"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5"><stop offset="0" stop-color="#6d5cff" stop-opacity=".30"/><stop offset="1" stop-color="#6d5cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".17"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9cb9ff"/><stop offset="1" stop-color="#4a78ff"/></linearGradient>
    <linearGradient id="in" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7656ff"/><stop offset="1" stop-color="#d2bdff"/></linearGradient>
  </defs>
  <!-- macOS icon grid: 824 px tile centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- Outgoing track fades out (falls), incoming track fades in (rises); the incoming curve passes over the interrupted outgoing one -->
  <path d="M268 376C462 376 562 648 756 648" pathLength="1" stroke-dasharray="0.3429 0.3141 1" fill="none" stroke="url(#out)" stroke-width="68" stroke-linecap="round"/>
  <path d="M268 648C462 648 562 376 756 376" fill="none" stroke="url(#in)" stroke-width="68" stroke-linecap="round"/>
</svg>
