# Build and test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: brew install ffmpeg
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit, integration and acceptance tests
        run: npm test
